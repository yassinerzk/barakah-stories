name: Supabase keep-alive

# Supabase pauses a free-tier project after 7 days without database activity,
# which takes sign-up, sync and account deletion down with it. This runs a real
# query every three days. If it fails, the run fails and GitHub emails the repo
# owner, so a paused project is noticed instead of discovered by users.
#
# GitHub also disables scheduled workflows after 60 days without repo activity;
# the keepalive step re-enables this one through the API (no dummy commits), so
# the job cannot silently stop the way the previous one did.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase secrets are not set"; exit 1
          fi
          # Row-level security returns no rows to the anon key, but the query
          # still runs against Postgres, which is what counts as activity.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/saved_designs?select=user_id&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase answered HTTP $code - the project may be paused. Restore it at supabase.com/dashboard."
            exit 1
          fi

      - uses: liskin/gh-workflow-keepalive@v1
